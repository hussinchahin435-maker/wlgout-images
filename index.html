<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Options - خيارات الخروج</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="buttons.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .specs {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 30px;
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        .specs strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚪 خيارات الخروج</h1>
        <p class="subtitle">اختر الخيار المناسب</p>

        <div class="grid grid-auto">
            <a href="#" class="button-item" title="تسجيل الخروج">
                <img src="logout.png" alt="تسجيل الخروج" class="img-md">
                <span>تسجيل الخروج</span>
            </a>

            <a href="#" class="button-item" title="إيقاف التشغيل">
                <img src="shutdown.png" alt="إيقاف التشغيل" class="img-md">
                <span>إيقاف التشغيل</span>
            </a>

            <a href="#" class="button-item" title="إعادة التشغيل">
                <img src="reboot.png" alt="إعادة التشغيل" class="img-md">
                <span>إعادة التشغيل</span>
            </a>

            <a href="#" class="button-item" title="وضع السبات">
                <img src="hibernate.png" alt="وضع السبات" class="img-md">
                <span>وضع السبات</span>
            </a>

            <a href="#" class="button-item" title="تعليق النظام">
                <img src="suspend.png" alt="تعليق النظام" class="img-md">
                <span>تعليق النظام</span>
            </a>

            <a href="#" class="button-item" title="قفل الشاشة">
                <img src="lock.png" alt="قفل الشاشة" class="img-md">
                <span>قفل الشاشة</span>
            </a>
        </div>

        <div class="specs">
            <strong>📋 مواصفات الصور:</strong><br>
            ✓ حجم موحد: 64x64 بكسل<br>
            ✓ خلفية شفافة (PNG)<br>
            ✓ جودة عالية (Retina Ready)<br>
            ✓ متوافق مع جميع المتصفحات
        </div>
    </div>
</body>
</html>
